<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Find Our Restaurant</title>
  <link rel="stylesheet" href="style.css">

  <script src="js/firebase-config.js" defer></script>
  <script src="js/location-redirect.js" defer></script>
</head>
<body>
  <main class="content">
    <section class="panel" style="max-width: 560px; margin: 60px auto; padding: 28px;">
      <h1 id="locationBusinessName">Find Our Restaurant</h1>
      <p id="locationStatus" role="status" aria-live="polite">
        Loading restaurant location...
      </p>
      <p id="locationAddress"></p>
      <a id="openGoogleMaps" href="#" hidden>
        Open Location in Google Maps
      </a>
    </section>
  </main>
</body>
</html>
