
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f6f8">
  <title>Admin Login | Restaurant Billing</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-page">

    <!-- Login Panel -->
    <section class="auth-card" id="login-panel"
      aria-labelledby="login-title">

      <header class="auth-header">
        <h1 id="login-title">Restaurant Billing</h1>
        <p>Sign in to your administrator account.</p>
      </header>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-email">Email Address</label>
          <input
            type="email"
            id="admin-email"
            name="email"
            autocomplete="username"
            placeholder="Enter admin email"
            required
          >
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="admin-password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg id="password-eye-icon"
                viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p id="login-message" role="status"
          aria-live="polite"></p>

        <button type="submit" id="admin-login-button">
          Sign In
        </button>
      </form>

      <div class="auth-links">
        <button type="button" class="auth-link"
          id="forgot-password-link">
          Forgot password?
        </button>
      </div>
    </section>

    <!-- Separate Password Reset Panel -->
    <section class="auth-card auth-hidden" id="password-reset-panel"
      aria-labelledby="reset-title" hidden>

      <header class="auth-header">
        <h1 id="reset-title">Reset Password</h1>
        <p>Recover access to your administrator account.</p>
      </header>

      <p class="auth-panel-description">
        Enter the email address associated with your account.
        If the account is eligible, Firebase will send a password
        reset link to that address.
      </p>

      <form id="password-reset-form">
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <input
            type="email"
            id="reset-email"
            name="email"
            autocomplete="email"
            placeholder="Enter your registered email"
            required
          >
        </div>

        <p id="reset-message" role="status"
          aria-live="polite"></p>

        <button type="submit" id="reset-submit-button">
          Send Reset Link
        </button>
      </form>

      <button type="button" class="auth-link auth-panel-back"
        id="back-to-login">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
          <path d="M9 12h12"/>
        </svg>
        Back to Sign In
      </button>
    </section>

  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

  <script>
    (() => {
      const passwordInput = document.getElementById("admin-password");
      const toggleButton = document.getElementById("password-toggle");
      const eyeIcon = document.getElementById("password-eye-icon");

      const loginPanel = document.getElementById("login-panel");
      const resetPanel = document.getElementById("password-reset-panel");

      const forgotLink = document.getElementById("forgot-password-link");
      const backLink = document.getElementById("back-to-login");
      const resetEmail = document.getElementById("reset-email");
      const loginEmail = document.getElementById("admin-email");

      toggleButton.addEventListener("click", () => {
        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword ? "text" : "password";
        toggleButton.setAttribute("aria-pressed", String(showPassword));
        toggleButton.setAttribute(
          "aria-label",
          showPassword ? "Hide password" : "Show password"
        );

        eyeIcon.innerHTML = showPassword
          ? '<path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/><path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>'
          : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      });

      forgotLink.addEventListener("click", () => {
        resetEmail.value = loginEmail.value.trim();
        document.getElementById("reset-message").textContent = "";
        document.getElementById("reset-message").className = "";
        loginPanel.hidden = true;
        loginPanel.classList.add("auth-hidden");
        resetPanel.hidden = false;
        resetPanel.classList.remove("auth-hidden");
        resetEmail.focus();
      });

      backLink.addEventListener("click", () => {
        resetPanel.hidden = true;
        resetPanel.classList.add("auth-hidden");
        loginPanel.hidden = false;
        loginPanel.classList.remove("auth-hidden");
        loginEmail.focus();
      });
    })();
  </script>
</body>
</html>
