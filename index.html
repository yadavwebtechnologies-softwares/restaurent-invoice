<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">

  <title>Owner Login | Restaurant Billing Software</title>

  <meta
    name="description"
    content="Secure owner login for Restaurant Billing Software."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <main class="auth-shell">

    <section class="auth-panel" aria-labelledby="loginHeading">

      <!-- Business Branding -->
      <header class="auth-header">
        <a
          class="auth-brand-strip"
          href="index.html"
          aria-label="Restaurant Billing Software login"
        >
          <span class="brand-mark" id="businessBrandMark" aria-hidden="true">B</span>

          <span class="brand-copy">
            <span
              class="brand-name"
              id="businessName"
              data-business-name
            >Your Business</span>

            <span
              class="brand-description"
              id="businessTagline"
              data-business-tagline
            >Restaurant Billing Software</span>
          </span>
        </a>
      </header>

      <!-- Login Content -->
      <div class="auth-content">

        <div class="auth-intro">
          <p class="section-eyebrow">OWNER ACCESS</p>

          <h1 id="loginHeading">Welcome back</h1>

          <p class="auth-description">
            Sign in to manage your billing and invoices.
          </p>
        </div>

        <form
          id="loginForm"
          class="auth-form"
          method="post"
          novalidate
        >

          <!-- Email -->
          <div class="form-field">
            <label for="loginEmail">Email address</label>

            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="Enter your email address"
              autocomplete="username"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>

          <!-- Password -->
          <div class="form-field">
            <div class="field-heading">
              <label for="loginPassword">Password</label>

              <button
                type="button"
                class="text-button"
                id="togglePassword"
                aria-controls="loginPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <!-- Account Actions -->
          <div class="auth-options">
            <span class="security-note">
              Secure owner sign-in
            </span>

            <button
              type="button"
              class="text-button"
              id="forgotPasswordBtn"
            >
              Forgot password?
            </button>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="btn btn-primary auth-submit"
            id="loginSubmitBtn"
          >
            <span class="button-label">Sign In</span>
          </button>

          <!-- Dynamic Feedback -->
          <div
            class="form-message"
            id="loginMessage"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></div>

        </form>

        <!-- Authentication / Configuration Status -->
        <p
          class="auth-system-status"
          id="authSystemStatus"
          role="status"
          aria-live="polite"
        ></p>

      </div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>Authorized business owners only.</p>
      </footer>

    </section>

  </main>

  <noscript>
    <p class="system-message">
      JavaScript is required to securely sign in.
      Please enable JavaScript and reload this page.
    </p>
  </noscript>

  <!-- Shared and Authentication Scripts -->
  <script src="js/script.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/auth.js" defer></script>

</body>
</html>
